<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HVAC Company Scraper</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --ok: #22c55e;
    --err: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  select, button {
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
  }
  select { min-width: 260px; }
  button {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .country-badge {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 999px;
  }

  .status-bar {
    padding: 14px 28px;
    color: var(--muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.listing, .dot.scraping, .dot.rating, .dot.saving { background: var(--accent); animation: pulse 1s infinite; }
  .dot.done { background: var(--ok); }
  .dot.error { background: var(--err); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  main { padding: 0 28px 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 10px 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg);
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pending { color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.error { color: var(--err); border-color: var(--err); }
  .empty-state { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>HVAC Company Scraper</h1>
  <p>Pick a product area, pull every matching company, then scrape phone &amp; website details.</p>
</header>

<div class="controls">
  <select id="industry">
    <option value="">Select a Product Area...</option>
    {% for slug, label in industries %}
    <option value="{{ slug }}">{{ label }}</option>
    {% endfor %}
  </select>
  <button id="startBtn">Find Companies</button>
  <span class="country-badge">Country: United States of America</span>
</div>

<div class="status-bar">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">Select a product area and click "Find Companies" to begin.</span>
</div>

<main>
  <table id="resultsTable" style="display:none;">
    <thead>
      <tr>
        <th>Company</th>
        <th>Profile URL</th>
        <th>Phone</th>
        <th>Website</th>
        <th>Address</th>
        <th>Email</th>
        <th>Rating</th>
        <th>Rating Notes</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState">No results yet.</div>
</main>

<script>
const industrySelect = document.getElementById('industry');
const startBtn = document.getElementById('startBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const resultsTable = document.getElementById('resultsTable');
const resultsBody = document.getElementById('resultsBody');
const emptyState = document.getElementById('emptyState');

let pollTimer = null;

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCompanies(companies) {
  if (!companies.length) {
    resultsTable.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  resultsTable.style.display = 'table';
  emptyState.style.display = 'none';

  resultsBody.innerHTML = companies.map(c => {
    const statusClass = c.status === 'done' ? 'done' : (c.status === 'error' ? 'error' : '');
    const statusLabel = c.status === 'done' ? 'Scraped' : (c.status === 'error' ? 'Error' : 'Pending');
    return `
      <tr>
        <td>${escapeHtml(c.name)}</td>
        <td><a href="${escapeHtml(c.url)}" target="_blank" rel="noopener">View</a></td>
        <td class="${c.phone ? '' : 'pending'}">${escapeHtml(c.phone) || '—'}</td>
        <td class="${c.website ? '' : 'pending'}">${c.website ? `<a href="${escapeHtml(c.website)}" target="_blank" rel="noopener">${escapeHtml(c.website)}</a>` : '—'}</td>
        <td class="${c.address ? '' : 'pending'}">${escapeHtml(c.address) || '—'}</td>
        <td class="${c.email ? '' : 'pending'}">${escapeHtml(c.email) || '—'}</td>
        <td class="${c.website_rating ? '' : 'pending'}">${escapeHtml(c.website_rating) || '—'}</td>
        <td class="${c.rating_notes ? '' : 'pending'}">${escapeHtml(c.rating_notes) || '—'}</td>
        <td><span class="badge ${statusClass}">${statusLabel}</span></td>
      </tr>`;
  }).join('');
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(state => {
    statusDot.className = 'dot ' + state.phase;
    statusText.textContent = state.message || '';
    renderCompanies(state.companies || []);

    if (state.phase === 'done' || state.phase === 'error') {
      startBtn.disabled = false;
      clearInterval(pollTimer);
    }
  });
}

startBtn.addEventListener('click', () => {
  const industry = industrySelect.value;
  if (!industry) {
    alert('Please select a product area first.');
    return;
  }
  startBtn.disabled = true;
  fetch('/api/scrape', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({industry})
  }).then(r => r.json()).then(data => {
    if (data.error) {
      alert(data.error);
      startBtn.disabled = false;
      return;
    }
    pollTimer = setInterval(poll, 1000);
    poll();
  });
});
</script>

</body>
</html>
